<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Připravujeme</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #1d4732 0%, #123c52 100%);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    padding: 28px;
    text-align: center;
  }
  main { max-width: 520px; }
  h1 {
    font-size: clamp(1.9rem, 5vw, 2.7rem);
    margin: 0 0 18px;
    line-height: 1.2;
    letter-spacing: -.01em;
  }
  p {
    font-size: 1.1rem;
    line-height: 1.65;
    color: rgba(255, 255, 255, .88);
    margin: 0 0 12px;
  }
  .rok {
    display: inline-block;
    border: 1px solid rgba(255, 255, 255, .35);
    background: rgba(255, 255, 255, .1);
    border-radius: 999px;
    padding: 5px 16px;
    font-size: .84rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 22px;
  }
  a {
    display: inline-block;
    margin-top: 26px;
    color: rgba(255, 255, 255, .6);
    font-size: .9rem;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, .3);
    padding-bottom: 2px;
  }
  a:hover { color: #fff; border-color: #fff; }
</style>
</head>
<body>
<main>
  <span class="rok">Velešovice 2026</span>
  <h1>Připravujeme</h1>
  <p>Na těchto stránkách najdete v průběhu roku informace o kandidatuře
     do zastupitelstva obce Velešovice.</p>
  <p>Zatím se pracuje na obsahu — děkujeme za trpělivost.</p>
  <a href="uvod.html">Interní náhled pro kandidáty</a>
</main>
</body>
</html>
