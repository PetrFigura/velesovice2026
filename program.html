<title>Interní náhled – SNK Velešovice</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #1d4732 0%, #123c52 100%);
    font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #1a2430; padding: 24px;
  }
  .box {
    background: #fff; border-radius: 18px; padding: 40px 36px; width: 100%; max-width: 430px;
    box-shadow: 0 18px 50px rgba(6, 24, 16, .35);
  }
  h1 { margin: 0 0 10px; font-size: 1.5rem; color: #1d4732; }
  p { margin: 0 0 22px; color: #4a5763; line-height: 1.6; font-size: .98rem; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input {
    padding: 13px 15px; font-size: 1.05rem; border: 2px solid #dde4e8; border-radius: 10px;
    font-family: inherit; width: 100%;
  }
  input:focus { outline: none; border-color: #2f6b4f; }
  button {
    padding: 13px 20px; font-size: 1rem; font-weight: 700; border: 0; border-radius: 999px;
    background: #2f6b4f; color: #fff; cursor: pointer; font-family: inherit;
  }
  button:hover { background: #1d4732; }
  button:disabled { opacity: .6; cursor: progress; }
  .err { color: #b3261e; font-size: .95rem; margin: 14px 0 0; }
  .err[hidden] { display: none; }
</style>
</head>
<body>
<div class="box">
  <h1>Interní náhled</h1>
  <p>Tyto stránky jsou zatím dostupné jen kandidátům sdružení SNK Velešovice.
     Zadejte prosím heslo.</p>
  <form id="form">
    <input type="password" id="pw" placeholder="Heslo" autocomplete="current-password" autofocus>
    <button type="submit" id="btn">Otevřít stránku</button>
  </form>
  <p class="err" id="err" hidden>Heslo není správné, zkuste to znovu.</p>
</div>

const KLIC  = "snk-velesovice-nahled";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function odemkni(heslo) {
  const km = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(heslo), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(DATA.s), iterations: 200000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64(DATA.i) }, key, b64(DATA.c));
  return new TextDecoder().decode(pt);
}

function zobraz(html) {
  document.open();
  document.write(html);
  document.close();
}

// Už odemčeno v této záložce? Otevři bez dotazu.
(async () => {
  const ulozene = sessionStorage.getItem(KLIC);
  if (!ulozene) return;
  try { zobraz(await odemkni(ulozene)); }
  catch (e) { sessionStorage.removeItem(KLIC); }
})();

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const heslo = document.getElementById("pw").value;
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  err.hidden = true;
  btn.disabled = true;
  btn.textContent = "Odemykám…";
  try {
    const html = await odemkni(heslo);
    sessionStorage.setItem(KLIC, heslo);
    zobraz(html);
  } catch (chyba) {
    err.hidden = false;
    btn.disabled = false;
    btn.textContent = "Otevřít stránku";
    document.getElementById("pw").select();
  }
});
</script>
