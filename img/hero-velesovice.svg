<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-label="Ilustrace obce Velešovice – kostel, domy a jihomoravská krajina">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe4f0"/>
      <stop offset="60%" stop-color="#eaf3f7"/>
      <stop offset="100%" stop-color="#f4f8f2"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb7a6"/>
      <stop offset="100%" stop-color="#7aa895"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f9f80"/>
      <stop offset="100%" stop-color="#5b8e6f"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8a67"/>
      <stop offset="100%" stop-color="#2f6b4f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#sky)"/>

  <!-- slunce -->
  <circle cx="1290" cy="150" r="62" fill="#ffffff" opacity=".7"/>

  <!-- vzdálené kopce -->
  <path d="M0 330 C 180 268, 330 300, 470 286 C 640 268, 780 316, 940 300 C 1120 282, 1300 320, 1600 292 L1600 700 L0 700 Z" fill="url(#hillFar)"/>
  <path d="M0 386 C 220 340, 400 374, 600 356 C 820 336, 1000 384, 1220 366 C 1400 351, 1500 372, 1600 360 L1600 700 L0 700 Z" fill="url(#hillMid)"/>

  <!-- stromořadí na horizontu -->
  <g fill="#4c8069" opacity=".75">
    <ellipse cx="120" cy="372" rx="26" ry="34"/>
    <ellipse cx="168" cy="378" rx="20" ry="26"/>
    <ellipse cx="1420" cy="358" rx="28" ry="36"/>
    <ellipse cx="1470" cy="364" rx="22" ry="28"/>
  </g>

  <!-- obec: kostel svaté Barbory (stylizace) -->
  <g>
    <!-- lodní část -->
    <rect x="716" y="378" width="168" height="112" fill="#fbf7ef"/>
    <path d="M706 378 L800 330 L894 378 Z" fill="#a8493b"/>
    <!-- věž -->
    <rect x="762" y="248" width="76" height="142" fill="#fdfaf3"/>
    <path d="M752 248 L800 176 L848 248 Z" fill="#8d3a30"/>
    <rect x="796" y="150" width="8" height="30" fill="#6d4a2f"/>
    <path d="M784 158 h40" stroke="#6d4a2f" stroke-width="8"/>
    <!-- ciferník a okna -->
    <circle cx="800" cy="286" r="15" fill="#e8e0d0" stroke="#9a8f7a" stroke-width="3"/>
    <rect x="782" y="322" width="15" height="30" rx="7" fill="#4a6d84"/>
    <rect x="804" y="322" width="15" height="30" rx="7" fill="#4a6d84"/>
    <rect x="742" y="418" width="22" height="44" rx="11" fill="#4a6d84"/>
    <rect x="838" y="418" width="22" height="44" rx="11" fill="#4a6d84"/>
  </g>

  <!-- vesnické domky vlevo -->
  <g>
    <rect x="440" y="424" width="128" height="72" fill="#f6f1e6"/>
    <path d="M430 424 L504 384 L578 424 Z" fill="#b9584a"/>
    <rect x="470" y="450" width="26" height="26" fill="#5d7f97"/>
    <rect x="516" y="450" width="26" height="26" fill="#5d7f97"/>

    <rect x="586" y="440" width="104" height="58" fill="#fdf8ee"/>
    <path d="M576 440 L638 406 L700 440 Z" fill="#a8493b"/>
    <rect x="612" y="460" width="24" height="24" fill="#5d7f97"/>
  </g>

  <!-- vesnické domky vpravo -->
  <g>
    <rect x="912" y="436" width="116" height="62" fill="#f7f2e7"/>
    <path d="M902 436 L970 400 L1038 436 Z" fill="#b9584a"/>
    <rect x="940" y="458" width="24" height="24" fill="#5d7f97"/>
    <rect x="982" y="458" width="24" height="24" fill="#5d7f97"/>

    <rect x="1046" y="448" width="96" height="50" fill="#fdf8ee"/>
    <path d="M1036 448 L1094 418 L1152 448 Z" fill="#a8493b"/>
    <rect x="1070" y="466" width="22" height="22" fill="#5d7f97"/>
  </g>

  <!-- stromy u obce -->
  <g>
    <rect x="688" y="466" width="8" height="32" fill="#5a4632"/>
    <circle cx="692" cy="454" r="30" fill="#417a5c"/>
    <rect x="898" y="470" width="7" height="28" fill="#5a4632"/>
    <circle cx="901" cy="458" r="25" fill="#4a8465"/>
    <rect x="1160" y="470" width="8" height="30" fill="#5a4632"/>
    <circle cx="1164" cy="456" r="28" fill="#417a5c"/>
  </g>

  <!-- pole a louky v popředí -->
  <path d="M0 498 C 300 470, 700 512, 1000 492 C 1250 476, 1420 504, 1600 486 L1600 700 L0 700 Z" fill="url(#field)"/>
  <g stroke="#79ab8b" stroke-width="3" opacity=".45">
    <path d="M0 560 C 400 528, 900 574, 1600 540"/>
    <path d="M0 612 C 420 578, 940 626, 1600 592"/>
    <path d="M0 664 C 440 630, 960 678, 1600 644"/>
  </g>

  <!-- potok Rakovec (stylizace) -->
  <path d="M-20 700 C 240 620, 520 610, 700 546 C 840 496, 900 500, 1000 512 L1000 700 Z" fill="#3d87ad" opacity=".28"/>
</svg>
