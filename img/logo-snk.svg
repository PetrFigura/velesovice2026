<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Logo SNK Velešovice">
  <title>SNK Velešovice</title>
  <defs>
    <linearGradient id="snkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#357254"/>
      <stop offset="100%" stop-color="#1f4d36"/>
    </linearGradient>
  </defs>

  <!-- podklad -->
  <rect width="120" height="120" rx="27" fill="url(#snkBg)"/>

  <!-- písmeno V jako dvě střechy -->
  <path d="M28 32 L60 86 L92 32" fill="none" stroke="#ffffff" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- voda (Rakovec) -->
  <path d="M27 102 q 8.25 -7.5 16.5 0 t 16.5 0 t 16.5 0 t 16.5 0" fill="none"
        stroke="#7ec6e4" stroke-width="6.5" stroke-linecap="round"/>
</svg>
